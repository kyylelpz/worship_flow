publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  cloud_firestore: ^7.1.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/worship-flow-icon-dark.png